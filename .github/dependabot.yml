version: 2
updates:
  # Automated security & version updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Automated security & version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/seo-agent"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
