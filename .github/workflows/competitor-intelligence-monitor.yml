name: Competitor Intelligence & Catalog Monitor

on:
  schedule:
    # Runs daily at 00:00 UTC (05:00 PKT)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: "competitor-monitor"
  cancel-in-progress: false

jobs:
  monitor:
    name: Run Competitor Probe & Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Competitor Intelligence Monitor
        run: |
          python scripts/competitor_monitor.py --verbose

      - name: Upload Competitor Snapshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: competitor-intelligence-snapshot
          path: data/competitor_history/
          if-no-files-found: ignore

