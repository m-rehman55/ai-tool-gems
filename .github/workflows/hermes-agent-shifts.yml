name: HERMES Autonomous 3-Shift SEO Agents & Telegram Reports

on:
  schedule:
    # 08:00 AM PKT (03:00 UTC) - Morning Technical Health Shift
    - cron: "0 3 * * *"
    # 02:00 PM PKT (09:00 UTC) - Afternoon Growth & Opportunity Shift
    - cron: "0 9 * * *"
    # 10:00 PM PKT (17:00 UTC) - Night Content & Link Graph Handoff
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      shift:
        description: "Choose Shift Routine to Run"
        required: true
        default: "all"
        type: choice
        options:
          - "morning"
          - "afternoon"
          - "night"
          - "all"

permissions:
  contents: write

concurrency:
  group: hermes-agent-shifts
  cancel-in-progress: false

jobs:
  run-shift-routine:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ATG_SITE_URL: https://aitoolgems.tech
      ATG_TIMEZONE: Asia/Karachi
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Active Shift
        id: select-shift
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "shift=${{ github.event.inputs.shift }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 2 ] && [ "$HOUR" -le 5 ]; then
              echo "shift=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 11 ]; then
              echo "shift=afternoon" >> $GITHUB_OUTPUT
            else
              echo "shift=night" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Execute HERMES Shift Routine & Dispatch Telegram Alert
        run: |
          python scripts/run_agent_shift.py --shift ${{ steps.select-shift.outputs.shift }}

      - name: Commit Updated Shift State Reports
        run: |
          git config user.name "HERMES-Autonomous-Agent"
          git config user.email "hermes@aitoolgems.tech"
          git add seo-agent/state/*.md
          git commit -m "chore(seo): update HERMES ${{ steps.select-shift.outputs.shift }} shift operational state report [skip ci]" || echo "No state changes to commit"
          git push origin main || echo "Push skipped or branch up to date"
