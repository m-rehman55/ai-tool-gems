name: Telegram bot commands

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-marketing-state
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      ATG_TIMEZONE: Asia/Karachi
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Telegram bot state cache
        uses: actions/cache/restore@v4
        with:
          path: marketing_agent/data/bot-state.json
          key: telegram-bot-state-${{ github.run_id }}
          restore-keys: |
            telegram-bot-state-
      - name: Configure menu and answer new commands
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "No TELEGRAM_BOT_TOKEN — skipping"; exit 0; fi
          python -m marketing_agent setup-bot || echo "setup-bot failed"
          python -m marketing_agent process-commands || echo "process-commands failed"
      - name: Save Telegram bot state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: marketing_agent/data/bot-state.json
          key: telegram-bot-state-${{ github.run_id }}
      - name: Save command cursor
        shell: bash
        run: |
          if git diff --quiet -- marketing_agent/data/bot-state.json; then exit 0; fi
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing_agent/data/bot-state.json
          git commit -m "Advance Telegram bot command cursor" || exit 0
          git push || echo "Direct push to main prevented by branch protection; cursor preserved in GitHub Actions cache"
