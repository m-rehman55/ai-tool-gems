name: Telegram bot commands

on:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-marketing-state
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      ATG_TIMEZONE: Asia/Karachi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure menu and answer new commands
        run: |
          python -m marketing_agent setup-bot
          python -m marketing_agent process-commands
      - name: Save command cursor
        shell: bash
        run: |
          if git diff --quiet -- marketing_agent/data/bot-state.json; then exit 0; fi
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing_agent/data/bot-state.json
          git commit -m "Advance Telegram bot command cursor"
          git push
