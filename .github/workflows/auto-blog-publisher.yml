name: AIToolGems Autonomous Bi-Daily Blog Publisher (Every 2 Days)

on:
  schedule:
    # Runs every 2 days at 09:00 PKT (04:00 UTC)
    - cron: "0 4 */2 * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish next eligible queue candidate"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Dry run preview mode (no commit, push, or live deployment)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-blog-publisher-state
  cancel-in-progress: false

jobs:
  publish-guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ATG_TIMEZONE: Asia/Karachi
      ATG_SITE_URL: https://aitoolgems.tech
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "seo-agent/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-agent/requirements.txt

      - name: Run Pre-Publication Quality Gates & Regression Suite
        run: |
          echo "🔍 Running pre-publication test suites..."
          python -m unittest discover -s tests -v
          python -m unittest discover -s keyword_agent/tests -v
          python -m unittest discover -s aio_agent/tests -v
          echo "🌐 Checking link graph integrity..."
          python scripts/link_graph_checker.py --strict
          echo "📊 Running Technical & Schema Audits..."
          python audit_all.py
          python schema_audit.py
          echo "🗺️ Validating sitemap integrity..."
          python scripts/generate_sitemap.py --check

      - name: Run Autonomous Blog Publisher
        id: publisher
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Mode: DRY RUN requested"
            python scripts/auto_blog_publisher.py
          else
            echo "Mode: LIVE PUBLISH requested"
            python scripts/auto_blog_publisher.py --publish
          fi

      - name: Commit and Push Newly Published Guide
        if: steps.publisher.outputs.status == 'PUBLISHED'
        id: git_push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "AI Tool Gems Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add guides/ blog/ sitemap.xml llms.txt data/seo/

          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "feat(content): publish autonomous guide '${{ steps.publisher.outputs.slug }}' [skip ci]"
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          # Strict PR creation to enforce human review gate (Defect 11 Fix)
          BRANCH_NAME="content/guide-${{ steps.publisher.outputs.slug }}"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          echo "✅ Pushed branch $BRANCH_NAME to origin. Creating pull request..."
          gh pr create \
            --title "feat(content): publish autonomous guide '${{ steps.publisher.outputs.title }}'" \
            --body "Autonomous editorial guide candidate for \`${{ steps.publisher.outputs.slug }}\`. Verified Pakistan PKR pricing and payment rails. 

⚠️ Release Gate: Requires human review and approval before merging to main. Production Pages deployment will execute automatically only after this PR is merged to main." \
            --base main \
            --head "$BRANCH_NAME" || true

      - name: Generate Job Summary
        if: always()
        shell: bash
        run: |
          STATUS="${{ steps.publisher.outputs.status }}"
          SLUG="${{ steps.publisher.outputs.slug }}"
          URL="${{ steps.publisher.outputs.url }}"
          TITLE="${{ steps.publisher.outputs.title }}"
          COMMITTED="${{ steps.git_push.outputs.committed }}"
          SHA="${{ steps.git_push.outputs.commit_sha }}"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🤖 AI Tool Gems Daily Blog Publisher Summary

          | Metric | Value |
          |---|---|
          | **Execution Mode** | ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'Dry Run (Preview)' || 'Candidate Generation' }} |
          | **Publisher Status** | \`${STATUS:-SKIPPED_OR_FAILED}\` |
          | **Candidate Slug** | \`${SLUG:-None}\` |
          | **Candidate Title** | ${TITLE:-N/A} |
          | **Staged URL** | ${URL:-N/A} |
          | **Git Commit** | \`${SHA:-N/A}\` |
          | **Deployment Status** | Candidate Staged in PR for Human Review (Not Deployed) |

          > [!IMPORTANT]
          > **Human Review Gate**: This candidate guide is staged on a dedicated branch and pull request. It is NOT deployed to production or published to GitHub Pages until explicitly reviewed, approved, and merged by the repository owner.
          EOF
