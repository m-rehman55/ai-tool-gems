name: HERMES SEO Agent Continuous Validation

on:
  push:
    branches:
      - main
    paths:
      - "seo-agent/**"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "tools/**"
      - "guides/**"
      - "deals/**"
      - "prices/**"
      - "blog/**"
      - "sitemap.xml"
  pull_request:
    branches:
      - main
    paths:
      - "seo-agent/**"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "tools/**"
      - "guides/**"
      - "deals/**"
      - "prices/**"
      - "blog/**"
      - "sitemap.xml"

permissions:
  contents: read

concurrency:
  group: hermes-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "seo-agent/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-agent/requirements.txt

      - name: Run Link Graph, Fragment & Route Integrity Checker
        run: |
          python scripts/link_graph_checker.py --strict

      - name: Run Integrity, Regression & UI Interaction Test Suites
        run: |
          python -m unittest discover -s tests -v

      - name: Run Site Technical & Schema Audits
        run: |
          python audit_all.py
          python schema_audit.py

      - name: Run Scope, Safety, Schema & Technical Unit Tests
        run: |
          python -m unittest discover -s seo-agent/tests -v

      - name: Run Offline Repository Audit
        run: |
          python -m seo-agent.agent.main --mode audit

      - name: Auto-Submit Updated URLs to IndexNow Protocol (Bing & Ahrefs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/submit_indexnow.py --all
