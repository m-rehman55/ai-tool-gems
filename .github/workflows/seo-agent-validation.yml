name: HERMES SEO Agent Continuous Validation

on:
  push:
    branches:
      - main
    paths:
      - "hermes_core/**"
      - "gsc_agent/**"
      - "crawler_agent/**"
      - "keyword_agent/**"
      - "bing_agent/**"
      - "ga4_agent/**"
      - "posthog_agent/**"
      - "pagespeed_agent/**"
      - "aio_agent/**"
      - "content_agent/**"
      - "backlink_agent/**"
      - "competitor_agent/**"
      - "marketing_agent/**"
      - "merchant_agent/**"
      - "conversion_agent/**"
      - "security_agent/**"
      - "ping_agent/**"
      - "seo-agent/**"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "tools/**"
      - "guides/**"
      - "deals/**"
      - "prices/**"
      - "blog/**"
      - "sitemap.xml"
  pull_request:
    branches:
      - main
    paths:
      - "hermes_core/**"
      - "gsc_agent/**"
      - "crawler_agent/**"
      - "keyword_agent/**"
      - "bing_agent/**"
      - "ga4_agent/**"
      - "posthog_agent/**"
      - "pagespeed_agent/**"
      - "aio_agent/**"
      - "content_agent/**"
      - "backlink_agent/**"
      - "competitor_agent/**"
      - "marketing_agent/**"
      - "merchant_agent/**"
      - "conversion_agent/**"
      - "security_agent/**"
      - "ping_agent/**"
      - "seo-agent/**"
      - "scripts/**"
      - "tests/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "tools/**"
      - "guides/**"
      - "deals/**"
      - "prices/**"
      - "blog/**"
      - "sitemap.xml"

permissions:
  contents: read

concurrency:
  group: hermes-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "seo-agent/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-agent/requirements.txt

      - name: Run Link Graph, Fragment & Route Integrity Checker
        run: |
          python scripts/link_graph_checker.py --strict

      - name: Run Site Technical & Schema Audits
        run: |
          python audit_all.py
          python schema_audit.py

      - name: Run Security, Secrets & Safety Firewall Gate
        run: |
          python -m security_agent audit

      - name: Run Google Merchant Center Feed & Review Parity Gate
        run: |
          python -m merchant_agent validate

      - name: Run Website Conversion & Trust Architecture Audit
        run: |
          python -m conversion_agent audit

      - name: Run Complete 18-Suite Multi-Agent Unit & Regression Tests (274 tests)
        run: |
          python scripts/run_all_tests.py

      - name: Run Offline Repository Audit
        run: |
          python -m seo-agent.agent.main --mode audit

      - name: Auto-Submit Updated URLs to IndexNow Protocol (Bing & Ahrefs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m ping_agent ping --all
