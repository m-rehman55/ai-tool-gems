name: AIToolGems Google AI Overviews & Grounding Daily Loop

on:
  schedule:
    - cron: "30 23 * * *"  # 04:30 PKT (UTC+05:00) daily [23:30 UTC previous day]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aio-agent-daily
  cancel-in-progress: false

jobs:
  run-aio-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run AIO Agent Unit Tests
        run: |
          python -m unittest discover -s aio_agent/tests -v

      - name: Run Site-Wide Google AI Overviews & Grounding Audit
        run: |
          python -m aio_agent audit

      - name: Synchronize Machine Knowledge Bases (llms.txt & llms-full.txt)
        run: |
          python -m aio_agent sync-llms

      - name: Commit & Push Knowledge Base Updates if Changed
        shell: bash
        run: |
          if git diff --quiet -- llms.txt llms-full.txt; then
            echo "Machine knowledge bases are up to date."
            exit 0
          fi
          git config user.name "AIToolGems AIO Agent"
          git config user.email "actions@users.noreply.github.com"
          git add llms.txt llms-full.txt
          git commit -m "chore(aio): auto-sync llms.txt knowledge bases for AI crawlers"
          git push
