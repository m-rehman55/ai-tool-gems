name: Repair current Buffer queue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/buffer-queue-repair.yml"

permissions:
  contents: write

concurrency:
  group: daily-social-marketing-state
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      ATG_WHATSAPP_NUMBER: "923236715731"
      ATG_TIMEZONE: Asia/Karachi
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install media dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Resolve Pakistan date
        id: campaign
        shell: bash
        run: echo "date=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_OUTPUT"
      - name: Test repair and publishing safeguards
        run: python -m unittest discover -s marketing_agent/tests -v
      - name: Verify all three owned Buffer channels
        run: python -m marketing_agent buffer-status
      - name: Rebuild Instagram Reel at Buffer-safe frame rate
        run: python -m marketing_agent buffer-prepare-platform --date "${{ steps.campaign.outputs.date }}" --service instagram --slot evening
      - name: Publish corrected Instagram Reel
        shell: bash
        run: |
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social-deals/ assets/product-logos/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render Instagram Reel at Buffer-safe frame rate"
          git push
      - name: Confirm refreshed media is public
        shell: bash
        run: |
          media_url="$(python - <<'PY'
          from datetime import date
          from marketing_agent.buffer import media_url_for
          day = date.fromisoformat('${{ steps.campaign.outputs.date }}')
          print(media_url_for(day, 'instagram', 'evening')[0])
          PY
          )"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /dev/null "$media_url"
      # Buffer can lock queued posts shortly before publishing; the command skips that safety window.
      - name: Repair future posts safely without duplicates
        run: python -m marketing_agent buffer-repair-future --date "${{ steps.campaign.outputs.date }}" --send
      - name: Save repair receipt
        if: always()
        shell: bash
        run: |
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing_agent/data/buffer-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Buffer queue repair"
          git push
      - name: Alert owner if repair needs attention
        if: failure()
        continue-on-error: true
        run: python -m marketing_agent social-alert
