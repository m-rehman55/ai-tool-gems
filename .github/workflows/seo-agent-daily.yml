name: AIToolGems HERMES Autonomous Growth Agent

on:
  schedule:
    - cron: "17 22 * * *"  # 03:17 PKT (UTC+05:00) daily [22:17 UTC previous day]
  workflow_dispatch:
    inputs:
      mode:
        description: "Agent Operational Mode (audit, propose, pr)"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - propose
          - pr
      live_crawl:
        description: "Perform live HTTP crawl against https://aitoolgems.tech"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: hermes-growth-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATG_TIMEZONE: Asia/Karachi
      ATG_SITE_URL: https://aitoolgems.tech
      GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
      GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
      GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "seo-agent/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r seo-agent/requirements.txt

      - name: Run Scope & Safety Firewall Test Suite
        run: |
          python -m unittest discover -s seo-agent/tests -v

      - name: Execute Autonomous SEO Growth Loop & Dispatch Telegram Report
        run: |
          MODE="${{ inputs.mode || 'audit' }}"
          LIVE_FLAG="${{ inputs.live_crawl && '--live' || '' }}"
          python -m seo-agent.agent.main --mode "$MODE" $LIVE_FLAG --report --json --telegram

      - name: Auto-Submit Updated Pages to IndexNow Protocol (Bing & Ahrefs)
        run: |
          python scripts/submit_indexnow.py --all

      - name: Upload Daily SEO Growth Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-seo-reports
          path: seo-agent/reports/
          retention-days: 30
