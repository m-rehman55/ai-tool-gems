name: Autonomous Daily SEO Blog Publisher

on:
  schedule:
    - cron: "00 0 * * *" # 05:00 AM PKT (00:00 UTC) every morning
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Publishing Mode"
        required: true
        default: "pr"
        type: choice
        options:
          - "pr"
          - "auto"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-blog-publishing
  cancel-in-progress: false

jobs:
  publish_daily_article:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INDEXNOW_KEY: "e1a8c47f9d2b4f30a6c8116de5b97042"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Autonomous Article Generation & Anti-Stuffing Audit
        run: |
          python scripts/auto_blog_publisher.py --publish

      - name: Verify Technical SEO, Schema Completeness & Inventory
        run: |
          python scripts/build_url_inventory.py
          python audit_all.py
          python schema_audit.py
          python scripts/growth_seo_engine.py

      - name: Commit and Create Pull Request (Safe Approval Mode)
        if: "${{ github.event.inputs.publish_mode == 'pr' || github.event_name == 'schedule' }}"
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(content): automated daily SEO guide draft ready for human approval"
          title: "🤖 [HERMES Content Engine] New Daily SEO Guide Draft"
          body: |
            ### 📝 Automated Daily SEO Content Submission
            
            This automated guide was generated by the **AIToolGems Autonomous Content Engine**:
            - ✅ Target: 1,500–2,000 words semantic long-form guide
            - ✅ 100% Google Search Central & Bing Webmaster compliant
            - ✅ JSON-LD Article, BreadcrumbList, and FAQPage schemas validated
            - ✅ Anti-stuffing keyword density audit passed (0.5% - 2.0%)
            - ✅ All internal links and Pakistani payment methods (EasyPaisa / JazzCash) verified
            
            **Review & Merge to trigger live GitHub Pages deployment and instant IndexNow search ping.**
          branch: "automated-daily-blog"
          delete-branch: true

      - name: Direct Publish & Ping Search Engines (Auto Mode)
        if: "${{ github.event.inputs.publish_mode == 'auto' }}"
        run: |
          git config user.name "AIToolGems-Hermes-Bot"
          git config user.email "bot@aitoolgems.tech"
          git add guides/ sitemap.xml
          git commit -m "feat(content): publish automated daily SEO guide [skip ci]" || echo "No changes to commit"
          git push origin main
          python scripts/growth_seo_engine.py --live
