name: Daily Pakistan social growth campaign
# BUFFER_API_KEY is supplied only through GitHub Actions repository secrets.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/social-content-pack.yml"
      - "marketing_agent/buffer.py"
      - "marketing_agent/config.py"
      - "marketing_agent/cli.py"
      - "marketing_agent/social.py"
      - "marketing_agent/tests/test_agent.py"
  schedule:
    - cron: "30 8 * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:
    inputs:
      pack_date:
        description: "Optional pack date (YYYY-MM-DD); blank uses today in Pakistan"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-social-marketing-state
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      ATG_TIMEZONE: Asia/Karachi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install social media dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Resolve Pakistan campaign date
        id: campaign
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pack_date }}" ]; then
            pack_date="${{ inputs.pack_date }}"
          else
            pack_date="$(TZ=Asia/Karachi date +%F)"
          fi
          echo "date=$pack_date" >> "$GITHUB_OUTPUT"
      - name: Run marketing-agent tests
        run: python -m unittest discover -s marketing_agent/tests -v
      - name: Verify Buffer connection and owned channels
        shell: bash
        run: |
          set +e
          output="$(python -m marketing_agent buffer-status 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            one_line="${output//$'\n'/ | }"
            echo "::error title=Buffer connection failed::$one_line"
            exit "$status"
          fi
      - name: Refresh real delivery and engagement results
        run: python -m marketing_agent buffer-learn
      - name: Build today's branded image and scheduled short video
        run: python -m marketing_agent buffer-prepare --date "${{ steps.campaign.outputs.date }}"
      - name: Publish deal card as public media
        shell: bash
        run: |
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social-deals/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Create daily social deal card for ${{ steps.campaign.outputs.date }}"
          git push
      - name: Confirm public media is ready
        shell: bash
        run: |
          python - <<'PY' > /tmp/media-urls.txt
          from datetime import date
          from marketing_agent.buffer import media_url_for
          day = date.fromisoformat('${{ steps.campaign.outputs.date }}')
          for service in ('facebook', 'instagram', 'tiktok'):
              print(media_url_for(day, service)[0])
          PY
          while IFS= read -r media_url; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 3 --output /dev/null "$media_url"
          done < /tmp/media-urls.txt
      - name: Schedule on Instagram, Facebook and TikTok
        shell: bash
        run: |
          set +e
          output="$(python -m marketing_agent buffer-publish --date "${{ steps.campaign.outputs.date }}" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            one_line="${output//$'\n'/ | }"
            echo "::error title=Buffer scheduling failed::$one_line"
            exit "$status"
          fi
      - name: Deliver private owner copy and short-video script
        run: python -m marketing_agent social-pack --date "${{ steps.campaign.outputs.date }}" --send
      - name: Save duplicate-protection state
        if: always()
        shell: bash
        run: |
          git config user.name "AI Tool Gems Bot"
          git config user.email "actions@users.noreply.github.com"
          git add marketing_agent/data/buffer-state.json marketing_agent/data/social-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record social delivery for ${{ steps.campaign.outputs.date }}"
          git push
